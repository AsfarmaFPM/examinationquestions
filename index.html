<title>Билетлар — машқ платформаси</title>
<style>
:root{color-scheme:light;--c:#0f766e;--bg:#fff;--t:#1f2937;--m:#6b7280;--l:#e5e7eb;--s:#f0fdfa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--l);padding:12px 14px;z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.w{max-width:820px;margin:0 auto}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}
.lang{display:flex;border:1px solid var(--c);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:#fff;color:var(--c);padding:6px 14px;font:600 14px inherit;cursor:pointer}
.lang button.on{background:var(--c);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--l);background:#fff;border-radius:999px;padding:6px 14px;font:500 14px inherit;color:var(--t);cursor:pointer}
.chips button.on{background:var(--c);border-color:var(--c);color:#fff}
main{padding:14px}
h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--c);margin:24px 0 8px}
.q{border:1px solid var(--l);border-radius:16px;padding:14px;margin-bottom:14px;background:#fff}
.m{font-size:12px;color:var(--m);margin-bottom:6px}
.t{font-weight:600;white-space:pre-line}
textarea{width:100%;margin-top:12px;border:1px solid var(--l);border-radius:12px;padding:11px 13px;font:16px/1.5 inherit;resize:none;min-height:110px;outline:none;overflow:hidden}
textarea:focus{border-color:var(--c)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.sv{border:0;background:var(--c);color:#fff;border-radius:12px;padding:10px 18px;font:600 15px inherit;cursor:pointer}
.st{font-size:13px;color:var(--m)}.st.ok{color:#15803d;font-weight:600}.st.er{color:#b91c1c;font-weight:600}.st.w{color:#b45309}
.hb{border:1px solid var(--c);background:#fff;color:var(--c);border-radius:12px;padding:9px 16px;font:600 15px inherit;cursor:pointer}
.hb.on{background:var(--c);color:#fff}
.a{margin-top:12px;padding:12px 14px;background:var(--s);border-left:4px solid var(--c);border-radius:8px;white-space:pre-line}
.a[hidden]{display:none}
</style></head><body>

</div></header>

<script>
const D=[{n:"Кардива",i:[
{k:"b",ru:["Каков механизм действия карведилола и чем он отличается от «чистых» β-блокаторов?","Карведилол — неселективный β1/β2-адреноблокатор с дополнительной α1-блокирующей и антиоксидантной активностью. Блокада α1-рецепторов вызывает вазодилатацию и снижает постнагрузку, поэтому АД снижается без повышения периферического сопротивления, которое характерно для «чистых» β-блокаторов."],uz:["Карведилолнинг таъсир механизми қандай ва у «соф» β-блокаторлардан нимаси билан фарқ қилади?","Карведилол — носелектив β1/β2-адреноблокатор бўлиб, қўшимча α1-блокловчи ва антиоксидант фаолликка эга. α1-рецепторларнинг блокадаси томирларни кенгайтиради ва постюкламани камайтиради, шу сабабли қон босими «соф» β-блокаторларга хос бўлган периферик қаршиликнинг ортишисиз пасаяди."]},
{k:"b",ru:["Как титровать карведилол при ХСН и при артериальной гипертензии?","ХСН: старт 3,125 мг 2 раза в сутки во время еды; дозу удваивают не чаще 1 раза в 2 недели до максимально переносимой; целевая — 25 мг 2 раза в сутки (при массе тела более 85 кг — до 50 мг 2 раза в сутки). АГ: 12,5 мг 1 раз в сутки первые 2 дня, затем 25 мг 1 раз в сутки; при необходимости через 2 недели и более — до 50 мг/сут. Принимать с пищей."],uz:["Карведилолни СЮЕ ва артериал гипертензияда қандай титрлаш керак?","СЮЕ: бошланғич доза 3,125 мг кунига 2 марта, овқат вақтида; дозани 2 ҳафтада камида 1 марта 2 баравар оширадилар, энг юқори кўтарилган дозагача; мақсадли доза — 25 мг кунига 2 марта (тана вазни 85 кг дан ортиқ бўлса — 50 мг кунига 2 марта гача). АГ: дастлабки 2 кун 12,5 мг кунига 1 марта, кейин 25 мг кунига 1 марта; зарур бўлса 2 ҳафта ва ундан кейин — 50 мг/кунгача. Овқат билан куннинг биринчи ярмида қабул қилинади."]},
{k:"b",ru:["Каковы противопоказания и основные меры предосторожности?","Противопоказания: декомпенсированная ХСН, требующая в/в инотропов; выраженная брадикардия, АВ-блокада II–III ст., СССУ; кардиогенный шок; выраженная гипотензия; бронхиальная астма и бронхоспазм; тяжёлая печёночная недостаточность. Нельзя резко отменять (риск синдрома отмены). При сахарном диабете возможна маскировка симптомов гипогликемии."],uz:["Қарши кўрсатмалар ва асосий эҳтиёт чоралари қандай?","Қарши кўрсатмалар: в/и инотроплар талаб қиладиган декомпенсацияланган СЮЕ; ифодаланган брадикардия, II–III даражали АВ-блокада, синус тугуни заифлиги синдроми; кардиоген шок; ифодаланган гипотензия; бронхиал астма ва бронхоспазм; оғир жигар етишмовчилиги. Дорини кескин бекор қилиб бўлмайди (бекор қилиш синдроми хавфи). Қандли диабетда гипогликемия белгилари яширилиши мумкин."]},
{k:"b",ru:["Какие ключевые исследования подтверждают эффективность карведилола?","COPERNICUS (тяжёлая ХСН — снижение общей смертности примерно на 35%), CAPRICORN (дисфункция ЛЖ после ИМ — снижение смертности около 23%), COMET (карведилол против метопролола тартрата при ХСН — смертность ниже примерно на 17%; сравнение было с короткодействующей формой метопролола), GEMINI (у больных АГ и СД 2 типа не ухудшал гликемический контроль)."],uz:["Карведилолнинг самарадорлигини қайси асосий тадқиқотлар тасдиқлайди?","COPERNICUS (оғир СЮЕ — умумий ўлимнинг тахминан 35% га камайиши), CAPRICORN (МИдан кейинги чап қоринча дисфункцияси — ўлимнинг тахминан 23% га камайиши), COMET (СЮЕда карведилол метопролол тартратга қарши — ўлим тахминан 17% га паст; таққослаш метопрололнинг қисқа таъсир қилувчи шакли билан бўлган), GEMINI (АГ ва 2-тур ҚД билан оғриганларда гликемик назоратни ёмонлаштирмаган)."]},
{k:"b",ru:["С какими препаратами карведилол взаимодействует наиболее значимо?","Ингибиторы CYP2D6 (пароксетин, флуоксетин, хинидин) повышают его концентрацию; верапамил, дилтиазем и амиодарон — риск брадикардии и АВ-блокады; дигоксин — возможен рост его уровня; инсулин и пероральные сахароснижающие — усиление гипогликемии; рифампицин снижает концентрацию карведилола. При совместной отмене с клонидином сначала отменяют β-блокатор."],uz:["Карведилол қайси дорилар билан энг муҳим даражада ўзаро таъсирлашади?","CYP2D6 ингибиторлари (пароксетин, флуоксетин, хинидин) унинг концентрациясини оширади; верапамил, дилтиазем ва амиодарон — брадикардия ва АВ-блокада хавфи оширади; дигоксин — унинг даражаси ошиши мумкин; инсулин ва ичиладиган қандни туширувчи дорилар — гипогликемиянинг кучайиши; рифампицин карведилол концентрациясини камайтиради. Клонидин билан бирга бекор қилинганда аввал β-блокатор бекор қилинади."]},
{k:"c",ru:["Кардиолог говорит: «Пациенту 62 года, ХСН II–III ФК, ФВ 32%, ЧСС 78, АД 120/75, СД 2 типа, принимает эналаприл и торасемид. Какой β-блокатор выбрать?» Что вы ответите?","Карведилол — один из β-блокаторов с доказанным снижением смертности при ХСН со сниженной ФВ (наряду с бисопрололом и метопролола сукцинатом); при СД метаболически нейтрален (GEMINI). Старт — 3,125 мг 2 раза в сутки с постепенной титрацией, начинать в стабильном состоянии без выраженной задержки жидкости. Выбор и дозу определяет врач; представитель даёт только информацию в рамках инструкции."],uz:["Кардиолог дейди: «Бемор 62 ёшда, СЮЕ II–III ФС, ЧҚЧ 32%, ЮУС 78, ҚБ 120/75, 2-тур ҚД, эналаприл ва торасемид қабул қилади. Қайси β-блокаторни танлаш керак?» Сиз нима дейсиз?","Карведилол — ЧҚЧ пасайган СЮЕда ўлимни камайтиргани исботланган β-блокаторлардан бири (бисопролол ва метопролол сукцинат қаторида); ҚДда метаболик нейтрал (GEMINI). Бошланғич доза — 3,125 мг кунига 2 марта, босқичма-босқич титрлаш билан; барқарор ҳолатда, суюқлик тутилиши ифодаланмаган пайтда бошлаш керак. Танлов ва дозани шифокор белгилайди; вакил фақат йўриқнома доирасида маълумот беради."]},
{k:"c",ru:["Врач возражает: «Я предпочитаю бисопролол — один приём в сутки и лучше переносится». Как вы ответите?","Признать, что бисопролол — хороший препарат с доказательной базой (CIBIS-II) и удобным режимом, особенно при сопутствующей ХОБЛ без бронхоспазма. Преимущества карведилола: α1-блокада и вазодилатация (полезны при АГ + ХСН), антиоксидантное действие, метаболическая нейтральность при СД, данные по тяжёлой ХСН (COPERNICUS). Ограничения: 2 раза в сутки, больше ортостатических явлений. Резюме: выбор зависит от профиля пациента (АГ + ХСН + СД — аргумент в пользу карведилола)."],uz:["Шифокор эътироз билдиради: «Мен бисопрололни афзал кўраман — кунига бир марта ва яхшироқ кўтарилади». Сиз қандай жавоб берасиз?","Бисопролол — ишончли исботлар базаси (CIBIS-II) ва қулай режимга эга яхши препарат эканини, айниқса бронхоспазмсиз ҚСОБ бўлганда, тан олиш керак. Карведилолнинг афзалликлари: α1-блокада ва вазодилатация (АГ + СЮЕда фойдали), антиоксидант таъсир, ҚДда метаболик нейтраллик, оғир СЮЕ бўйича маълумотлар (COPERNICUS). Чекловлари: кунига 2 марта, ортостатик ҳодисалар кўпроқ. Хулоса: танлов беморнинг профилига боғлиқ (АГ + СЮЕ + ҚД — карведилол фойдасига далил)."]},
{k:"c",ru:["Нужно составить план продвижения карведилола на квартал для региона. Какие аудитории, каналы и метрики вы выберете?","Аудитории: кардиологи стационаров и поликлиник, терапевты/ВОП, эндокринологи (пациенты с СД). Каналы: визиты с клиническими материалами, круглые столы, региональные кардиологические конференции. Метрики: охват и частота визитов, число врачей с повторными назначениями, наличие в аптеках, продажи по регионам."],uz:["Ҳудуд учун карведилолни илгари суришнинг чораклик режасини тузиш керак. Қайси аудиториялар, каналлар ва метрикаларни танлайсиз?","Аудиториялар: стационар ва поликлиника кардиологлари, терапевт/УАШ, эндокринологлар (ҚД бор беморлар). Каналлар: клиник материаллар билан ташрифлар, СЮЕ бўйича давра суҳбатлари, ҳудудий кардиология конференциялари. Метрикалар: ташрифлар қамрови ва частотаси, такрорий тайинловчи шифокорлар сони, дорихоналарда мавжудлик, ҳудудлар бўйича сотувлар."]}
]},{n:"Асформин",i:[
{k:"b",ru:["Каков механизм действия метформина?","Метформин — бигуанид: снижает продукцию глюкозы печенью (глюконеогенез), повышает чувствительность тканей к инсулину и усиливает периферическое поглощение глюкозы. Тормозит всасывание глюкозы в тонком кишечнике. Он не стимулирует секрецию инсулина, поэтому риск гипогликемии низкий, а масса тела остаётся нейтральной или слегка снижается."],uz:["Метформиннинг таъсир механизми қандай?","Метформин — бигуанид: жигарда глюкоза ишлаб чиқарилишини (глюконеогенез) камайтиради, тўқималарнинг инсулинга сезгирлигини оширади ва глюкозанинг периферик ўзлаштирилишини кучайтиради. Ингичка ичакларда глюкозани сўрилишини тормозлайди. У инсулин секрециясини рағбатлантирмайди, шу сабабли гипогликемия хавфи паст, тана вазни ўзгармайди ёки бироз камаяди."]},
{k:"b",ru:["Каковы противопоказания и ограничения по функции почек?","Противопоказаны: рСКФ <30 мл/мин, острые состояния с риском нарушения функции почек или гипоксии (сепсис, шок, ОИМ, тяжёлая дыхательная недостаточность), диабетический кетоацидоз, тяжёлая печёночная недостаточность, хронический алкоголизм. При рСКФ 30–44 терапию не начинают, а у принимающих — снижают дозу (обычно до 1000 мг/сут); при рСКФ ≥45 ограничений нет при регулярном контроле. Возможно развитие лактоацидоза. При длительном приёме — контроль витамина B12."],uz:["Қарши кўрсатмалар ва буйрак функцияси бўйича чекловлар қандай?","Қарши кўрсатмалар: рКФТ <30 мл/мин, буйрак функцияси бузилиши ёки гипоксия хавфи бўлган ўткир ҳолатлар (сепсис, шок, ЎМИ, оғир нафас етишмовчилиги), диабетик кетоацидоз, оғир жигар етишмовчилиги, сурункали алкоголизм. рКФТ 30–44 бўлганда даво бошланмайди, қабул қилаётганларда доза камайтирилади (одатда 1000 мг/кунгача); рКФТ ≥45 бўлса, мунтазам назоратда чекловлар йўқ. Лактоацидоз кам учраш хавфи мавжуд. Узоқ қабул қилганда — В12 витаминини назорат қилиш."]},
{k:"b",ru:["Какова доказательная база метформина и его место в современных рекомендациях?","UKPDS показал у пациентов с избыточной массой тела значимое снижение риска осложнений диабета, инфаркта миокарда и общей смертности. Метформин остаётся основой терапии СД 2 типа в рекомендациях (ADA/EASD) эффективный, безопасный, недорогой, с огромным клиническим опытом."],uz:["Метформиннинг исботлар базаси қандай ва замонавий тавсияномаларда унинг ўрни қандай?","UKPDS тана вазни ортиқча беморларда диабет асоратлари, миокард инфаркти ва умумий ўлим хавфининг сезиларли камайишини кўрсатди. Метформин тавсияномаларда (ADA/EASD) 2-тур ҚД даволашнинг асоси бўлиб қолмоқда: самарали, хавфсиз, арзон, катта клиник тажрибага эга."]},
{k:"b",ru:["Какие взаимодействия метформина наиболее важны?","Йодсодержащие рентгеноконтрастные средства: метформин временно отменяют на момент исследования при рСКФ 30–60 (и при печёночной недостаточности, алкоголизме, ХСН), возобновляют не ранее чем через 48 ч после оценки функции почек. Алкоголь повышает риск лактоацидоза. Диуретики, ГКС, β2-агонисты могут влиять на гликемию и функцию почек. Циметидин повышает концентрацию метформина."],uz:["Метформиннинг қайси ўзаро таъсирлари энг муҳим?","Йодли рентген контраст воситалар: рКФТ 30–60 бўлганда (ва жигар етишмовчилиги, алкоголизм, СЮЕда) текширув пайтида метформин вақтинча бекор қилинади, буйрак функцияси баҳоланганидан кейин камида 48 соат ўтгач қайта бошланади. Алкоголь лактоацидоз хавфини оширади. Диуретиклар, ГКС, β2-агонистлар гликемия ва буйрак функциясига таъсир қилиши мумкин. Циметидин метформин концентрациясини оширади."]},
{k:"b",ru:["Как дозируется метформин у пациентов с хронической болезнью почек (ХБП) в зависимости от показателя СКФ (eGFR) и как часто необходимо контролировать функцию почек?","СКФ ≥ 60 мл/мин/1,73 м²: при отсутствии противопоказаний обычно допускается применение стандартной дозы.\nСКФ 45–59 мл/мин/1,73 м²: лечение, как правило, можно продолжать. При повышенном риске лактацидоза врач может снизить дозу.\nСКФ 30–44 мл/мин/1,73 м²: при продолжении лечения суточную дозу обычно ограничивают до 1000 мг. Согласно инструкции США, начинать лечение в этом диапазоне не рекомендуется; некоторые клинические рекомендации допускают индивидуальное решение.\nСКФ < 30 мл/мин/1,73 м²: применение метформина противопоказано, препарат необходимо отменить.\nКонтроль: при СКФ ниже 60 мл/мин/1,73 м² функцию почек обычно проверяют не реже одного раза в 3–6 месяцев. При остром заболевании или ухудшении состояния контроль проводят чаще.\nВажно: дозу метформина должен определять врач с учётом функции почек, риска лактацидоза и официальной инструкции к конкретному препарату."],uz:["Сурункали буйрак касаллиги (СБК) мавжуд бўлган беморларда метформиннинг дозаси СКФ (eGFR) кўрсаткичига қараб қандай белгиланади ва буйраклар функциясини қанчалик тез-тез назорат қилиш керак?","СКФ ≥ 60 мл/мин/1,73 м²: қарши кўрсатмалар бўлмаса, одатда стандарт дозада қўллаш мумкин.\nСКФ 45–59 мл/мин/1,73 м²: одатда даволашни давом эттириш мумкин. Лактоацидоз хавфи юқори бўлса, шифокор дозани камайтириши мумкин.\nСКФ 30–44 мл/мин/1,73 м²: даволаш давом эттирилганда, одатда, суткалик доза 1000 мг гача чекланади. АҚШ йўриқномасига кўра, ушбу диапазонда даволашни янгидан бошлаш тавсия этилмайди; айрим клиник тавсияларда эса индивидуал қарор қабул қилиниши мумкин.\nСКФ < 30 мл/мин/1,73 м²: метформин қўллаш мумкин эмас, уни бекор қилиш керак.\nНазорат: СКФ 60 мл/мин/1,73 м² дан паст бўлганда буйраклар функциясини, одатда, ҳар 3–6 ойда камида бир марта текшириш лозим. Ўткир касаллик ёки бемор аҳволи ёмонлашганда назорат тез-тез амалга оширилади.\nМуҳим: метформин дозасини шифокор беморнинг буйраклар функцияси, лактоацидоз хавфи ва препаратнинг расмий йўриқномасини ҳисобга олган ҳолда белгилайди."]},
{k:"c",ru:["Эндокринолог: «Пациентка 55 лет, ИМТ 33, HbA1c 8,2%, рСКФ 52, лечения не получала. С чего начать и как избежать жалоб со стороны ЖКТ?»","Метформин — препарат первой линии: начать с 500 мг во время ужина, каждые 1–2 недели повышать на 500 мг до 1500–2000 мг/сут. При ЖКТ-жалобах замедлить титрацию. рСКФ 52 допускает стандартные дозы при контроле функции почек каждые 3–6 месяцев. Если HbA1c значительно выше цели, врач может рассмотреть раннюю комбинацию."],uz:["Эндокринолог: «Бемор аёл 55 ёшда, ТВИ 33, HbA1c 8,2%, рКФТ 52, илгари даволанмаган. Нимадан бошлаш керак ва ошқозон-ичак шикоятларидан қандай қутулиш мумкин?»","Метформин — биринчи қатор препарати: кечки овқат вақтида 500 мг дан бошлаб, ҳар 1–2 ҳафтада 500 мг дан 1500–2000 мг/суткагача ошириш. ОИТ шикоятлари бўлса, титрлашни секинлаштириш. рКФТ 52 буйрак функцияси ҳар 3–6 ойда назорат қилинганда одатий дозаларга рухсат беради. HbA1c мақсаддан анча юқори бўлса, шифокор эрта комбинацияни кўриб чиқиши мумкин."]},
{k:"c",ru:["Эндокринолог: «Сейчас всем пациентам с СД 2 типа нужно назначать эмпаглифлозин, метформин устарел». Как вы ответите?","Согласиться, что SGLT2-ингибиторы и агонисты рГПП-1 имеют самостоятельные кардио- и нефропротективные преимущества у пациентов с ССЗ, ХБП и ХСН — но это дополнение, а не замена. Метформин остаётся основой: доказанная эффективность и безопасность, низкая стоимость, доступность для большинства пациентов, десятилетия опыта. SGLT2i дороже, есть риск генитальных инфекций и ограничения при низкой СКФ. Позиция: «метформин + при показаниях SGLT2i/рГПП-1»."],uz:["Эндокринолог: «Ҳозир 2-тур ҚД бор барча беморларга эмпаглифлозин тайинлаш керак, метформин эскирди». Сиз қандай жавоб берасиз?","SGLT2 ингибиторлари ва рГПП-1 агонистлари ЮҚТК, СБК ва СЮЕ бор беморларда мустақил кардио- ва нефропротектив афзалликларга эга эканига рози бўлиш керак — аммо бу қўшимча, алмаштириш эмас. Метформин асос бўлиб қолади: исботланган самарадорлик ва хавфсизлик, паст нарх, аксарият беморлар учун мавжудлик, ўнлаб йиллик тажриба. SGLT2i қимматроқ, жинсий аъзолар инфекциялари хавфи ва паст КФТда чекловлар бор. Позиция: «метформин + кўрсатма бўлса SGLT2i/рГПП-1»."]},
{k:"c",ru:["Какие каналы и мероприятия вы используете для продвижения метформина среди врачей и в аптечном канале?","Врачи: эндокринологи, терапевты/ВОП, кардиологи (СД + ССЗ) — визиты, конференции, школы диабета, круглые столы. Мероприятия к Всемирному дню диабета (14 ноября). Скрининг-тестирование в семейных поликлиниках: измерение уровня глюкозы в крови и анкетирование с помощью чат-бота Асформин. Аптеки: совместные скрининг-акции с аптечными сетями (измерение уровня глюкозы в крови и анкетирование с помощью чат-бота Асформин) с направлением к врачу, обучение провизоров. Метрики: охват врачей, число скринингов, наличие в аптеках, продажи."],uz:["Метформинни шифокорлар орасида ва дорихона каналида илгари суриш учун қайси каналлар ва тадбирлардан фойдаланасиз?","Шифокорлар: эндокринологлар, терапевт/УАШ, кардиологлар (ҚД + ЮҚТК) — визитлар, конференциялар, диабет мактаблари, давра суҳбатлари. Оилавий поликлиникаларда скрининг тестлар (глюкоза ўлчаш, Asformin Chat Bot сўровномаси) ўтказиш ва уларни терапевт/УАШ га йўналтириш, Жаҳон диабет куни (14 ноябрь) тадбирларида қатнашиш. Дорихоналар: дорихона тармоқлари билан биргаликда скрининг акциялари (глюкоза ўлчаш, Asformin Chat Bot сўровномаси) шифокорга йўналтириш билан, провизорларни ўқитиш. Метрикалар: шифокорлар қамрови, скрининглар сони, дорихоналарда мавжудлик, сотувлар."]}
]},{n:"Дилютикс",i:[
{k:"b",ru:["Каковы основные показания к применению клопидогрела?","Острый коронарный синдром (с подъёмом и без подъёма ST — в комбинации с АСК); профилактика атеротромботических событий после недавнего инфаркта миокарда, ишемического инсульта и при заболевании периферических артерий; после стентирования коронарных артерий (двойная антитромбоцитарная терапия). Точный перечень — по утверждённой инструкции."],uz:["Клопидогрелни қўллашнинг асосий кўрсатмалари қандай?","Ўткир коронар синдром (ST кўтарилиши билан ва кўтарилишисиз — АСК билан комбинацияда); яқинда ўтказилган миокард инфаркти, ишемик инсульт ва периферик артериялар касаллигида атеротромботик ҳодисалар профилактикаси; коронар артерияларни стентлашдан кейин (қўш антитромбоцитар терапия)."]},
{k:"b",ru:["Как дозируют клопидогрел и какова длительность терапии?","75 мг 1 раз в сутки независимо от приёма пищи. При ОКС — нагрузочная доза 300 мг (в ряде схем 600 мг), далее 75 мг/сут вместе с АСК. Длительность двойной терапии при ОКС обычно до 12 месяцев; сокращение или продление определяет врач по риску ишемии и кровотечений. У пожилых коррекция дозы не требуется."],uz:["Клопидогрел қандай дозаланади ва даво давомийлиги қанча?","75 мг кунига 1 марта, овқатланишга боғлиқ бўлмаган ҳолда. ЎКСда — юклама дозаси 300 мг (айрим схемаларда 600 мг), кейин АСК билан бирга 75 мг/кун. ЎКСда қўш терапия давомийлиги одатда 12 ойгача; қисқартириш ёки узайтиришни шифокор ишемия ва қон кетиш хавфига қараб белгилайди. Кекса ёшдагиларда дозани тузатиш талаб қилинмайди."]},
{k:"b",ru:["Каковы основные риски и меры предосторожности?","Основной риск — кровотечения (ЖКТ, внутричерепные), редко — ТТП и нейтропения. Противопоказания: активное кровотечение (язва, внутричерепное кровоизлияние), тяжёлая печёночная недостаточность. Перед плановой операцией врач решает вопрос об отмене примерно за 7 дней. После стентирования самовольная отмена опасна — риск тромбоза стента. НПВС, антикоагулянты и СИОЗС повышают риск кровотечений."],uz:["Асосий хавфлар ва эҳтиёт чоралари қандай?","Асосий хавф — қон кетишлар (ОИТ, бош мия), кам ҳолларда — нейтропения. Қарши кўрсатмалар: фаол қон кетиш (яра, бош мияга қон қуйилиши), оғир жигар етишмовчилиги. Режали операциядан олдин шифокор тахминан 7 кун илгари бекор қилиш масаласини ҳал қилади. Стентлашдан кейин ўзбошимчалик билан бекор қилиш хавфли — стент тромбози хавфи. Ностероид яллиғланишга қарши дорилар, антикоагулянтлар ва SSRI гурухига киривчилар қон кетиш хавфини оширади."]},
{k:"b",ru:["Какие лекарственные взаимодействия клопидогрела наиболее важны?","Ингибиторы CYP2C19 (омепразол, эзомепразол, а также, например, флуконазол и флувоксамин) снижают образование активного метаболита; при необходимости ИПП предпочтителен пантопразол. Клопидогрел повышает экспозицию репаглинида (CYP2C8) — сочетания избегают. НПВС, антикоагулянты, СИОЗС — риск кровотечений."],uz:["Клопидогрелнинг қайси дорилар ўзаро таъсири энг муҳим?","CYP2C19 ингибиторлари (омепразол, эзомепразол, шунингдек, масалан, флуконазол ва флувоксамин) фаол метаболит ҳосил бўлишини камайтиради; ППИ зарур бўлса, пантопразол афзал. Клопидогрел репаглинид (CYP2C8) таъсирини оширади — бундай қўшилмалардан сақланилади. НЯҚД, антикоагулянтлар, SSRI — қон кетиш хавфи."]},
{k:"b",ru:["Какие исследования лежат в основе доказательной базы клопидогрела?","CAPRIE (клопидогрел против АСК у пациентов с атеротромбозом — небольшое относительное снижение риска), CURE (ОКС без подъёма ST: клопидогрел + АСК снижает частоту комбинированной конечной точки примерно на 20%), CLARITY-TIMI 28 и COMMIT (ИМ с подъёмом ST). Для инсульта/ТИА — данные CHANCE и POINT по краткосрочной двойной терапии при малом инсульте высокого риска. CHANCE и POINT подтвердили, что раннее добавление клопидогрела к аспирину уменьшает риск повторных ишемических событий после малого ишемического инсульта или ТИА высокого риска. CHANCE показало снижение риска инсульта без выявленного увеличения умеренных и тяжёлых кровотечений при 21-дневной ДАТТ. POINT подтвердило эффективность комбинации, но выявило увеличение крупных кровотечений при её применении в течение 90 дней. Совокупность данных поддерживает ограничение двойной терапии преимущественно первыми 21 сутками у подходящих пациентов."],uz:["Клопидогрелнинг исботлар базаси қайси тадқиқотларга асосланади?","CAPRIE (атеротромбозли беморларда клопидогрел АСКга қарши — хавфнинг нисбатан сезиларли камайиши), CURE (ST кўтарилишисиз ЎКС: клопидогрел + АСК бирлашган якуний нуқта частотасини тахминан 20% га камайтиради), CLARITY-TIMI 28 ва COMMIT (ST кўтарилишли МИ). Инсульт/ТИА учун — юқори хавфли кичик инсультда қисқа муддатли қўш терапия бўйича CHANCE ва POINT маълумотлари. CHANCE ва POINT тадқиқотлари аспиринга клопидогрелни эрта қўшиш кичик ишемик инсульт ёки юқори хавфли ТИАдан кейин такрорий ишемик ҳодисалар хавфини камайтиришини тасдиқлади. CHANCE тадқиқоти 21 кунлик икки томонлама антиагрегант терапия (ДАТТ) давомида инсульт хавфи камайганини ва ўртача ҳамда оғир қон кетишлар кўпайиши аниқланмаганини кўрсатди. POINT тадқиқоти комбинациянинг самарадорлигини тасдиқлади, бироқ терапия 90 кун давомида қўлланилганда йирик қон кетишлар хавфи ошишини аниқлади."]},
{k:"c",ru:["Мужчина 58 лет после ЧКВ со стентом принимает АСК + клопидогрел; жалуется на изжогу, ВОП назначил омепразол. Что вы посоветуете врачу?","Омепразол и эзомепразол снижают активацию клопидогрела через CYP2C19. Рекомендовать врачу рассмотреть пантопразол, поскольку защита ЖКТ при двойной антитромбоцитарной терапии оправдана у пациентов с высоким риском кровотечений."],uz:["58 ёшли эркак стентли ЧКВдан кейин АСК + клопидогрел қабул қилади; жиғилдон қайнашидан шикоят қилади, ОАШ омепразол тайинлаган. Шифокорга нима маслаҳат берасиз?","Омепразол ва эзомепразол CYP2C19 орқали клопидогрелнинг фаолланишини камайтиради. Шифокорга пантопразолни кўриб чиқишни тавсия қилиш керак, чунки қўш антитромбоцитар терапияда ОИТ ҳимояси қон кетиш хавфи юқори беморларда асосли."]},
{k:"c",ru:["Кардиолог: «При ОКС я назначаю только тикагрелор, клопидогрел слабее». Как вы ответите?","Согласиться: рекомендации (ESC/ACC) при ОКС отдают предпочтение тикагрелору и прасугрелу (PLATO, TRITON), но у них выше риск кровотечений. Клопидогрел остаётся оптимальным: при высоком риске кровотечений, у пожилых, при необходимости комбинации с пероральным антикоагулянтом (ФП), при хронических коронарных синдромах после ЧКВ, при деэскалации ДАТТ, после ишемического инсульта/ТИА, а также при одышке или недоступности/стоимости тикагрелора (приём 1 раз в сутки). Богатый опыт применения."],uz:["Кардиолог: «ЎКСда мен фақат тикагрелор тайинлайман, клопидогрел кучсизроқ». Сиз қандай жавоб берасиз?","Рози бўлиш керак: тавсияномалар (ESC/ACC) ЎКСда тикагрелор ва прасугрелни афзал кўради (PLATO, TRITON), лекин уларда қон кетиш хавфи юқорироқ. Клопидогрел қуйидаги ҳолларда мақбул бўлиб қолади: қон кетиш хавфи юқори бўлганда, кексаларда, ичиладиган антикоагулянт билан комбинация зарур бўлганда (ЮТФ), ЧКВдан кейинги сурункали коронар синдромларда, ДАТТни деэскалация қилганда, ишемик инсульт/ТИАдан кейин, шунингдек тикагрелордан нафас қисилиши бўлганда ёки у мавжуд бўлмаганда/қиммат бўлганда (кунига 1 марта қабул). Қўллаш бўйича катта тажриба мавжуд."]},
{k:"c",ru:["Какие каналы и инструменты продвижения клопидогрела вы выберете для региона, включая стационарный сегмент?","Каналы: визиты к кардиологам, неврологам, интервенционным кардиологам и сосудистым хирургам; стационарный сегмент (формуляры, тендеры, работа с закупочными комиссиями); конференции по ОКС и инсульту; «школы вторичной профилактики». Метрики: охват врачей, доля в госзакупках, программа реимбурсация, наличие в аптеках - уровень пенетрации."],uz:["Ҳудуд, шу жумладан стационар сегменти учун клопидогрелни илгари суришнинг қайси каналлари ва воситаларини танлайсиз?","Каналлар: кардиологлар, неврологлар, интервенцион кардиологлар ва томир хирургларига ташрифлар; стационар сегменти (формулярлар, тендерлар, харид комиссиялари билан ишлаш); ЎКС ва инсульт бўйича конференциялар; «иккиламчи профилактика мактаблари». Метрикалар: шифокорлар қамрови, давлат харидларидаги улуш, реимбурсация дастури, дорихоналарда мавжудлик - пенетрация даражаси."]}
]},{n:"Эвалеп",i:[
{k:"b",ru:["Каков механизм действия леветирацетама?","Леветирацетам связывается с белком синаптических везикул SV2A и модулирует высвобождение нейротрансмиттеров. Механизм отличается от натриевых каналов и ГАМК-ергических систем, на которые действует большинство классических противоэпилептических препаратов."],uz:["Леветирацетамнинг таъсир механизми қандай?","Леветирацетам синаптик везикулалар SV2A оқсили билан боғланади ва нейротрансмиттерлар ажралишини модуляция қилади. Бу механизм кўпчилик классик эпилепсияга қарши препаратлар таъсир қиладиган натрий каналлари ва ГАМК тизимларидан фарқ қилади."]},
{k:"b",ru:["Каковы показания к применению леветирацетама?","Монотерапия фокальных приступов (с вторичной генерализацией или без) у пациентов от 16 лет с впервые диагностированной эпилепсией; в качестве дополнительной терапии — фокальные приступы (от 1 месяца), миоклонические приступы при ювенильной миоклонической эпилепсии (от 12 лет), первично-генерализованные тонико-клонические приступы при идиопатической генерализованной эпилепсии (от 12 лет)."],uz:["Леветирацетамни қўллаш кўрсатмалари қандай?","Янги аниқланган эпилепсияли 16 ёшдан катта беморларда фокал хуружларнинг (иккиламчи генерализацияли ёки генерализациясиз) монотерапияси; қўшимча терапия сифатида — фокал хуружлар (1 ойдан), ўспирин миоклоник эпилепсиясида миоклоник хуружлар (12 ёшдан), идиопатик генерализацияланган эпилепсияда бирламчи генерализацияланган тоник-клоник хуружлар (12 ёшдан)."]},
{k:"b",ru:["Какие нежелательные реакции и меры предосторожности наиболее важны?","Частые: сонливость, астения, головокружение, головная боль. Нейропсихиатрические: раздражительность, агрессия, тревожность, депрессия, редко — суицидальные мысли; необходимо наблюдать за настроением и поведением (особенно у детей и подростков). Осторожность при почечной недостаточности. Противопоказание — гиперчувствительность. Резкая отмена повышает риск приступов и эпилептического статуса."],uz:["Энг муҳим ножўя таъсирлар ва эҳтиёт чоралари қайсилар?","Тез-тез: уйқучанлик, астения, бош айланиши, бош оғриғи. Нейропсихиатрик: жаҳлдорлик, агрессия, хавотир, депрессия, кам ҳолларда — суицидал фикрлар; кайфият ва хулқ-атвор назорат қилиниши керак (айниқса болалар ва ўсмирларда). Буйрак етишмовчилигида эҳтиёт бўлиш керак. Қарши кўрсатма — юқори сезувчанлик. Кескин бекор қилиш хуружлар ва эпилептик статус хавфини оширади."]},
{k:"b",ru:["В чём фармакокинетические преимущества леветирацетама при полипрогмазии?","Леветирацетам не метаболизируется системой цитохрома P450 (гидролизуется ферментами вне печени), слабо связывается с белками (<10%), имеет линейную фармакокинетику и практически не вступает в клинически значимые взаимодействия, в том числе с пероральными контрацептивами и антикоагулянтами. Рутинный мониторинг концентрации обычно не нужен. Это удобно у пожилых, при онкологических, психо-неврологических, сердечно-сосудистых и других сопутствующих заболеваниях."],uz:["Полифармацияда леветирацетамнинг фармакокинетик афзалликлари нимада?","Леветирацетам цитохром P450 тизими орқали метаболизмга учрамайди (жигардан ташқарида ферментлар билан гидролизланади), оқсиллар билан кучсиз боғланади (<10%), чизиқли фармакокинетикага эга ва клиник аҳамиятли ўзаро таъсирларга, шу жумладан ичиладиган контрацептивлар ва антикоагулянтлар билан, деярли киришмайди. Концентрацияни мунтазам мониторинг қилиш одатда керак эмас. Бу кексаларда, онкологик, рухий-неврологик, юрак-қон томир ва бошқа йўлдош касалликларда қулай."]},
{k:"b",ru:["Как корректировать дозу леветирацетама у детей с печёночной недостаточностью и на что необходимо обратить внимание при сочетании с почечной недостаточностью?","При лёгкой и умеренной печёночной недостаточности отдельная коррекция дозы леветирацетама обычно не требуется. При тяжёлой печёночной недостаточности необходимо тщательно оценить функцию почек. Согласно инструкции, при клиренсе креатинина ниже 60 мл/мин/1,73 м² рекомендуется уменьшить поддерживающую суточную дозу на 50%. Дозу у детей определяют индивидуально с учётом возраста, массы тела и функции почек под наблюдением врача."],uz:["Жигар етишмовчилиги бўлган болаларда леветирацетам дозасини қандай ўзгартириш керак ва буйрак етишмовчилиги ҳам мавжуд бўлганда нималарга эътибор бериш лозим?","Жигар етишмовчилигининг енгил ва ўртача даражаларида леветирацетам дозасини алоҳида ўзгартириш одатда талаб этилмайди. Жигар етишмовчилигининг оғир даражасида буйраклар функциясини синчковлик билан баҳолаш зарур. Препаратининг йўриқномасига кўра, креатинин клиренси 60 мл/мин/1,73 м² дан паст бўлганда сақлаб турувчи суткалик дозани 50% га камайтириш тавсия этилади. Болаларда доза ёш, тана вазни ва буйраклар функциясини ҳисобга олган ҳолда шифокор назорати остида индивидуал белгиланади."]},
{k:"c",ru:["Невролог: «Пациентке 28 лет, эпилепсия, принимает вальпроат, планирует беременность. Что рассмотреть?»","Вальпроат имеет высокий тератогенный риск и риск нарушений нейроразвития, поэтому у женщин детородного возраста по возможности используют альтернативы. Леветирацетам по данным регистров (EURAP, UK Epilepsy and Pregnancy Register) связаны с относительно низким риском пороков. Перевод проводит невролог под наблюдением, с фолиевой кислотой; в III триместре концентрация леветирацетама снижается, возможен мониторинг."],uz:["Невролог: «Бемор аёл 28 ёшда, эпилепсия, вальпроат қабул қилади, ҳомиладорликни режалаштирмоқда. Нималарни кўриб чиқиш керак?»","Вальпроат юқори тератоген хавфга ва нейроривожланиш бузилишлари хавфига эга, шунинг учун туғиш ёшидаги аёлларда имкон бўлса алтернативалардан фойдаланилади. Леветирацетам регистр маълумотларига (EURAP, UK Epilepsy and Pregnancy Register) кўра нуқсонларнинг нисбатан паст хавфи билан боғлиқ. Ўтказишни невролог кузатув остида, фолат кислотаси билан амалга оширади; III триместрда леветирацетам концентрацияси пасаяди, мониторинг мумкин."]},
{k:"c",ru:["Невролог: «Для фокальной эпилепсии я беру ламотриджин или карбамазепин, леветирацетам — только add-on». Как ответить?","Уважительно признать, что ламотриджин — сильный вариант (SANAD II), а карбамазепин — классика. Преимущества леветирацетама: быстрая титрация до эффективной дозы, отсутствие индукции/ингибирования ферментов (у карбамазепина — влияние на контрацептивы, антикоагулянты, статины и др.), нет необходимости в рутинном лабораторном контроле. Подходит пожилым, пациентам с полипрагмазии, онкологией, печёночной патологией."],uz:["Невролог: «Фокал эпилепсияда мен ламотриджин ёки карбамазепинни оламан, леветирацетам — фақат қўшимча». Қандай жавоб берасиз?","Ламотриджин кучли вариант (SANAD II), карбамазепин эса классика эканини ҳурмат билан тан олиш керак. Леветирацетамнинг афзалликлари: самарали дозагача тез титрлаш, ферментлар индукцияси/ингибицияси йўқлиги (карбамазепинда — контрацептивлар, антикоагулянтлар, статинлар ва бошқаларга таъсир), мунтазам лаборатор назорат зарур эмаслиги. Кексалар, полипрагмазия, онкологик ва жигар патологиясидаги беморларга мос."]},
{k:"c",ru:["Составьте план продвижения леветирацетама: аудитории, каналы, работа с аптеками.","ЦА: неврологи городских и областных центров, эпилептологи частных клиник, детские неврологи, нейрохирургия. Каналы: клинические разборы - кейс репорт и круглые столы, конференции ассоциации неврологов и эпилептологов, школы для пациентов и родителей (через врачей), образовательные онлайн-материалы - через социальные сети. Обучение провизоров в аптеках: наличие дозировок 250, 500 и 1000 мг, приемлемость цены и важность бесперебойного наличия препарата в аптеках. Метрики: охват неврологов и эпилептологов, наличие в аптеках по регионам - уровень пенетрации."],uz:["Леветирацетамни илгари суриш режасини тузинг: аудиториялар, каналлар, дорихоналар билан ишлаш.","МА: шаҳар ва вилоят марказлари неврологлари, эпилептология хоналари, болалар неврологлари, нейрохирургия. Каналлар: клиник таҳлиллар ва давра суҳбатлари, неврологлар ассоциацияси конференциялари, беморлар ва ота-оналар учун мактаблар (шифокорлар орқали), онлайн таълим материаллари. Дорихоналар: провизорларни ўқитиш — 250, 500, 1000 мг дозалар мавжудлиги, нархдаги афвзаллик, доимий мавжудлик. Метрикалар: невролог ва эпилептологлар қамрови, ҳудудлар бўйича дорихоналарда мавжудлик."]}
]},{n:"Дорепам",i:[
{k:"b",ru:["Каков механизм действия эсциталопрама?","Эсциталопрам — S-энантиомер циталопрама, селективный ингибитор обратного захвата серотонина (СИОЗС). Повышая концентрацию серотонина в синапсе, он улучшает серотонинергическую передачу; практически не влияет на другие рецепторы (гистаминовые, мускариновые, адренергические), что обусловливает хорошую переносимость."],uz:["Эсциталопрамнинг таъсир механизми қандай?","Эсциталопрам — циталопрамнинг S-энантиомери, серотонинни қайта ўзлаштиришнинг селектив ингибитори (SSRI). Синапсда серотонин концентрациясини ошириб, серотонинергик узатишни яхшилайди; бошқа рецепторларга (гистамин, мускарин, адренергик) деярли таъсир қилмайди, бу яхши кўтарувчанликни таъминлайди."]},
{k:"b",ru:["Каковы показания к применению эсциталопрама?","Большой депрессивный эпизод; генерализованное тревожное расстройство; паническое расстройство с агорафобией или без; социальное тревожное расстройство (социофобия); обсессивно-компульсивное расстройство."],uz:["Эсциталопрамни қўллаш кўрсатмалари қандай?","Катта депрессив эпизод; генерализацияланган хавотир бузилиши; агорафобия билан ёки агорафобиясиз вахима; ижтимоий хавотир бузилиши (ижтимоий фобия); обсессив-компульсив бузилиш."]},
{k:"b",ru:["Каковы основные риски и противопоказания?","Дозозависимое удлинение интервала QT (максимум 20 мг/сут; нельзя сочетать с другими препаратами, удлиняющими QT; учитывать гипокалиемию, брадикардию). Противопоказаны ИМАО (интервал 14 дней), линезолид, пимозид. Серотониновый синдром, гипонатриемия у пожилых, повышенный риск кровотечений с НПВС и антикоагулянтами, сексуальная дисфункция, синдром отмены. В начале терапии возможно усиление тревоги; у молодых пациентов необходим мониторинг суицидальных мыслей."],uz:["Асосий хавфлар ва қарши кўрсатмалар қандай?","Дозага боғлиқ QT интервали узайиши (максимум 20 мг/кун; QT ни узайтирувчи бошқа препаратлар билан қўшиб бўлмайди; гипокалиемия, брадикардияни ҳисобга олиш). МАО ингибиторлари (14 кун оралиқ), линезолид, пимозид қарши кўрсатилган. Серотонин синдроми, кексаларда гипонатриемия, НЯҚД ва антикоагулянтлар билан қон кетиш хавфининг ортиши, жинсий дисфункция, бекор қилиш синдроми. Даво бошида хавотир кучайиши мумкин; ёшларда суицидал фикрлар мониторинг қилиниши керак."]},
{k:"b",ru:["Чем профиль взаимодействий эсциталопрама выгодно отличается от других СИОЗС?","Эсциталопрам — слабый ингибитор CYP2D6, поэтому взаимодействий меньше, чем у пароксетина и флуоксетина (сильные ингибиторы CYP2D6). Тем не менее он повышает экспозицию метопролола; ингибиторы CYP2C19 (омепразол, циметидин) повышают его собственную концентрацию. С триптанами, трамадолом — риск серотонинового синдрома."],uz:["Эсциталопрамнинг ўзаро таъсир профили бошқа SSRIлардан қандай афзаллик билан фарқ қилади?","Эсциталопрам — CYP2D6 нинг кучсиз ингибитори, шунинг учун ўзаро таъсирлар пароксетин ва флуоксетинга (CYP2D6 нинг кучли ингибиторлари) қараганда камроқ. Лекин у метопролол таъсирини оширади; CYP2C19 ингибиторлари (омепразол, циметидин) унинг ўз концентрациясини оширади. Триптанлар, трамадол — серотонин синдроми хавфи."]},
{k:"b",ru:["Что известно о сравнительной эффективности и переносимости эсциталопрама?","В сетевых метаанализах Cipriani et al. (2009, 2018) эсциталопрам входил в число антидепрессантов с наилучшим соотношением эффективности и переносимости. Он имеет широкую доказательную базу при депрессии и тревожных расстройствах. Важно не преувеличивать: различия между современными антидепрессантами невелики, выбор определяется профилем пациента, сопутствующими заболеваниями и взаимодействиями."],uz:["Эсциталопрамнинг қиёсий самарадорлиги ва кўтарувчанлиги ҳақида нима маълум?","Cipriani ва ҳамкасблари (2009, 2018) тармоқли метатаҳлилларида эсциталопрам самарадорлик ва кўтарувчанлик нисбати энг яхши антидепрессантлар қаторида бўлган. У депрессия ва хавотир бузилишларида кенг исботлар базасига эга. Муболаға қилмаслик муҳим: замонавий антидепрессантлар ўртасидаги фарқлар катта эмас, танлов беморнинг профили, йўлдош касалликлар ва ўзаро таъсирлар билан белгиланади."]},
{k:"c",ru:["ВОП: «Женщина 66 лет, депрессия, АГ, ИБС (ИМ год назад), принимает метопролол и АСК. Какой антидепрессант выбрать?»","Эсциталопрам возможен, но с мерами предосторожности: в возрасте старше 65 лет старт 5 мг, максимум 10 мг; ЭКГ с оценкой QTc до и после начала, контроль калия и магния; учесть рост экспозиции метопролола и риск кровотечений на АСК (оценить гастропротекцию). При ИБС после ИМ наибольший объём данных по безопасности."],uz:["ОАШ: «Аёл 66 ёшда, депрессия, АГ, ЮИК (бир йил олдин МИ), метопролол ва АСК қабул қилади. Қайси антидепрессантни танлаш керак?»","Эсциталопрам мумкин, лекин эҳтиёт чоралари билан: 65 ёшдан катта ёшда бошланғич доза 5 мг, максимум 10 мг; даво бошлашдан олдин ва кейин QTc баҳоланган ЭКГ, калий ва магний назорати; метопролол таъсирининг ортиши ва АСК фонидаги қон кетиш хавфини ҳисобга олиш (гастропротекцияни баҳолаш). МИдан кейинги ЮИКда хавфсизлик бўйича энг катта маълумотлар ҳажми мавжудлиги."]},
{k:"c",ru:["Психиатр: «Амитриптилин привычнее, пароксетин мощнее, дулоксетин лучше при болевом синдроме. Зачем эсциталопрам?» Как ответить?","Признать сильные стороны конкурентов: амитриптилин — классика но очень много побочки; дулоксетин — вариант при сопутствующей боли. Преимущества эсциталопрама: высокая селективность и хорошая переносимость, меньше лекарственных взаимодействий (в отличие от пароксетина), режим 1 раз в сутки с понятной стартовой дозой 5 мг, 10 мг и 20 мг, широкий спектр тревожных и депрессивных показаний. При наличии сопутствующих заболеваний, таких как артериальная гипертензия (АГ), ишемическая болезнь сердца (ИБС), перенесённый инсульт, эпилепсия или сахарный диабет 2-го типа, эсциталопрам можно рассматривать как один из вариантов антидепрессивной терапии с учётом индивидуального профиля безопасности, противопоказаний и лекарственных взаимодействий."],uz:["Психиатр: «Амитриптилин одатийроқ, пароксетин кучлироқ, дулоксетин оғриқ синдромида яхшироқ. Нега эсциталопрам?» Қандай жавоб берасиз?","Рақобатчиларнинг кучли томонларини тан олиш керак: амитриптилин — классика аммо ножўя таъсирларга бой антидепрессант; дулоксетин — йўлдош оғриқ бўлганда яхши вариант. Эсциталопрамнинг афзалликлари: юқори селективлик ва яхши кўтарувчанлик, дориларнинг ўзаро таъсири камроқ (пароксетин фарқли), кунига 1 марта режим ва тушунарли 10 мг бошланғич доза, хавотир ва депрессив кўрсатмаларнинг кенг доираси. Танлов бемор ва йўлдош касалликлар билан белгиланади. Артериал гипертензия (АГ), юрак ишемик касаллиги (ЮИК), ўтказилган инсульт, эпилепсия ёки 2-тур қандли диабет каби ҳамроҳ касалликлар мавжуд бўлганда, эсциталопрамни антидепрессив терапия вариантларидан бири сифатида кўриб чиқиш мумкин. Бунда беморнинг индивидуал хавфсизлик профили, қарши кўрсатмалар ва дори воситалари ўртасидаги ўзаро таъсирлар ҳисобга олиниши керак."]},
{k:"c",ru:["Невролог: Тревога + бессонница + просьба о быстром эффекте. Ситуация: Пациент хочет начать эсциталопрам, чтобы уже на следующий день избавиться от тревоги и бессонницы. Вопрос: Как объяснить ожидаемый эффект и избежать неверных обещаний?","Эсциталопрам не является препаратом для немедленного купирования тревоги. Первые изменения могут появиться через 1–2 недели, а полный эффект часто требует 3-4 недель или дольше. При начале лечения эсциталопрамом иногда рассматривают кратковременную «терапию прикрытия», если выражена тревога, ажитация или тяжёлая бессонница. Цель — временно облегчить симптомы, пока антидепрессант постепенно начинает действовать."],uz:["Невролог: хавотир ва уйқусизлик, тез таъсир кўрсатишга бўлган эҳтиёж. Вазият: Бемор хавотир ва уйқусизликдан эртаси куниёқ халос бўлиш мақсадида эсциталопрамни қабул қилишни бошламоқчи. Савол: Кутиладиган таъсирни қандай тушунтириш ва асоссиз ваъдалар беришдан қандай қочиш мумкин?","Эсциталопрам хавотирни зудлик билан бартараф этиш учун мўлжалланган препарат эмас. Дастлабки ижобий ўзгаришлар 1–2 ҳафта ичида кузатилиши мумкин, тўлиқ терапевтик таъсирга эришиш учун эса кўпинча 3-4 ҳафта ёки ундан кўпроқ вақт талаб этилади. Эсциталопрам билан даволашни бошлашда, агар дастлабки ҳафталарда хавотир кучайса, психомотор қўзғалиш пайдо бўлса ёки оғир уйқусизлик сақланиб қолса, қисқа муддатли «қўллаб-қувватловчи терапия» кўриб чиқилиши мумкин. Унинг мақсади — антидепрессант аста-секин таъсир кўрсата бошлагунга қадар симптомларни вақтинча енгиллаштириш."]}
]},{n:"Бикарбонорм",i:[
{k:"b",ru:["Как подбирают дозу при метаболическом ацидозе на фоне ХБП?","Дозу подбирает врач по уровню бикарбоната сыворотки, АД и отёкам. В практике часто начинают с 500–1000 мг 2–3 раза в сутки после еды, титруя с контролем показателей; ориентир — не превышать верхнюю границу нормы. Рекомендации KDIGO 2024 допускают лечение при бикарбонате <18 ммоль/л у взрослых; KDOQI предлагает поддерживать ≥22 ммоль/л. Принимать после еды, разделяя с другими лекарствами примерно на 2 часа."],uz:["ССК фонидаги метаболик ацидозда доза қандай танланади?","Дозани шифокор қон зардобидаги бикарбонат даражаси, ҚБ ва шишларга қараб танлайди. Амалиётда одатда овқатдан кейин кунига 2–3 марта 1000 мг дан бошланади, кўрсаткичлар назорати остида титрланади; мўлжал — меъёрнинг юқори чегарасидан ошмаслик. KDIGO 2024 тавсиялари катталарда бикарбонат <18 ммоль/л бўлганда даволашга йўл қўяди; KDOQI ≥22 ммоль/л даражада сақлашни таклиф қилади. Овқатдан кейин қабул қилинади, бошқа дорилардан тахминан 2 соат ажратилади."]},
{k:"b",ru:["Каковы основные риски и противопоказания?","Натриевая нагрузка: задержка жидкости, повышение АД, отёки (осторожно при ХСН, АГ, ХБП с отёками). При избыточных дозах — метаболический алкалоз, гипокалиемия, гипокальциемия. Вздутие и отрыжка из-за CO2. Противопоказаны метаболический алкалоз, гипохлоремия, гипокальциемия. Длительное самостоятельное применение с кальцием может привести к молочно-щелочному синдрому."],uz:["Асосий хавфлар ва қарши кўрсатмалар қандай?","Натрий юкламаси: суюқлик тутилиши, ҚБ ортиши, шишлар (СЮЕ, АГ, шишли СБКда эҳтиёт бўлиш). Ортиқча дозаларда — метаболик алкалоз, гипокалиемия, гипокальциемия. CO2 сабабли қоринда дам бўлиши ва кекириш. Метаболик алкалоз, гипохлоремия, гипокальциемия қарши кўрсатилган. Кальций билан узоқ ўзбошимчалик билан қўллаш сут-ишқор синдромига олиб келиши мумкин."]},
{k:"b",ru:["Какие лекарственные взаимодействия следует учитывать?","Бикарбонат снижает всасывание железа, кетоконазола, ряда фторхинолонов и тетрациклинов — приём разделяют на ~2 часа. Защелачивание мочи усиливает выведение кислых препаратов (салицилаты, фенобарбитал) и замедляет выведение основных (хинидин, псевдоэфедрин, амфетамины). С диуретиками повышается риск алкалоза; с препаратами кальция — риск молочно-щелочного синдрома."],uz:["Қайси дорилар ўзаро таъсирини ҳисобга олиш керак?","Бикарбонат темир, кетоконазол, айрим фторхинолонлар ва тетрациклинлар сўрилишини камайтиради — қабул ~2 соатга ажратилади. Сийдикни ишқорлаш кислотали препаратлар (салицилатлар, фенобарбитал) чиқарилишини кучайтиради ва асосли препаратлар (хинидин, псевдоэфедрин, амфетаминлар) чиқарилишини секинлаштиради. Диуретиклар билан алкалоз хавфи ортади; кальций препаратлари билан — сут-ишқор синдроми хавфи."]},
{k:"b",ru:["Лекарственные взаимодействия натрия бикарбоната с кардиопрепаратами разных групп.","• иАПФ (эналаприл, периндоприл): прямого значимого взаимодействия обычно нет. При ХБП необходимо контролировать калий и функцию почек.\n• Сартаны (лозартан, валсартан): прямого значимого взаимодействия обычно нет. Контролируют калий, функцию почек и артериальное давление.\n• Бета-блокаторы (бисопролол, карведилол): клинически значимого прямого взаимодействия обычно нет. При сочетании с другими факторами риска требуется контроль давления и электролитов.\n• Диуретики (фуросемид, гидрохлоротиазид, спиронолактон): взаимодействие зависит от препарата. Натрия бикарбонат увеличивает натриевую нагрузку и может ослаблять контроль отёков. Возможны изменения калия и кислотно-основного состояния.\nГлавное: наиболее важна осторожность при ХБП, сердечной недостаточности, гипертензии и лечении диуретиками. Следует контролировать АД, отёки, натрий, калий и бикарбонат крови. Натрия бикарбонат не следует автоматически считать противопоказанным при приёме перечисленных препаратов."],uz:["Натрий бикарбонатнинг турли гуруҳдаги кардиологик препаратлар билан дори воситалари ўзаро таъсири.","• АПФ ингибиторлари (эналаприл, периндоприл): одатда клиник аҳамиятга эга тўғридан-тўғри ўзаро таъсир кузатилмайди. СБК мавжуд бўлганда қонда калий миқдори ва буйраклар функциясини назорат қилиш зарур.\n• Сартанлар (лозартан, валсартан): одатда клиник аҳамиятга эга тўғридан-тўғри ўзаро таъсир кузатилмайди. Қонда калий миқдори, буйраклар функцияси ва артериал қон босимини назорат қилиш лозим.\n• Бета-блокаторлар (бисопролол, карведилол): одатда клиник аҳамиятга эга тўғридан-тўғри ўзаро таъсир кузатилмайди. Бошқа хавф омиллари мавжуд бўлганда қон босими ва электролитларни назорат қилиш талаб этилади.\n• Диуретиклар (фуросемид, гидрохлоротиазид, спиронолактон): ўзаро таъсир препарат турига боғлиқ. Натрий бикарбонат натрий юкламасини оширади ва шишларни назорат қилишни қийинлаштириши мумкин. Қонда калий миқдори ва кислота-ишқор мувозанати ўзгариши эҳтимоли бор.\nАсосий хулоса: СБК, юрак етишмовчилиги, артериал гипертензия ва диуретиклар билан даволанишда алоҳида эҳтиёткорлик талаб этилади. Артериал қон босими, шишлар, қонда натрий, калий ва бикарбонат миқдорини назорат қилиш лозим. Кўрсатилган препаратларни қабул қилиш натрий бикарбонатни қўллаш учун автоматик равишда қарши кўрсатма ҳисобланмайди."]},
{k:"b",ru:["Лекарственные взаимодействия натрия бикарбоната с сахароснижающими препаратами.","• Ингибиторы SGLT-2 (дапаглифлозин, эмпаглифлозин): прямого значимого взаимодействия обычно нет. Важно учитывать риск кетоацидоза, в том числе при нормальном или умеренно повышенном уровне глюкозы. Натрия бикарбонат не заменяет лечение кетоацидоза.\n• Ингибиторы DPP-4 (ситаглиптин, вилдаглиптин): клинически значимого прямого взаимодействия обычно нет. При ХБП может потребоваться коррекция дозы отдельных препаратов этой группы.\n• Агонисты рецепторов GLP-1 (семаглутид, лираглутид): прямого значимого взаимодействия обычно нет. При рвоте и диарее важно контролировать гидратацию и функцию почек.\n• Метформин: прямого значимого взаимодействия обычно нет. При ХБП необходимо учитывать риск накопления метформина и лактоацидоза. Натрия бикарбонат не предотвращает и не заменяет лечение лактоацидоза.\nГлавное: при сочетании натрия бикарбоната с этими препаратами особое внимание уделяют функции почек, кислотно-основному состоянию и водно-электролитному балансу. При подозрении на кетоацидоз или лактоацидоз необходима срочная медицинская оценка."],uz:["Натрий бикарбонатнинг турли гуруҳдаги қанд миқдорини пасайтирувчи препаратлар билан дори воситалари ўзаро таъсири","• SGLT-2 ингибиторлари (дапаглифлозин, эмпаглифлозин): одатда клиник аҳамиятга эга тўғридан-тўғри ўзаро таъсир кузатилмайди. Қонда глюкоза меъёрда ёки бироз юқори бўлганда ҳам кетоацидоз ривожланиши мумкинлигини ҳисобга олиш зарур. Натрий бикарбонат кетоацидозни даволаш ўрнини босмайди.\n• DPP-4 ингибиторлари (ситаглиптин, вилдаглиптин): одатда клиник аҳамиятга эга тўғридан-тўғри ўзаро таъсир кузатилмайди. СБК мавжуд бўлганда ушбу гуруҳдаги айрим препаратлар дозасини ўзгартириш талаб қилиниши мумкин.\n• GLP-1 рецепторлари агонистлари (семаглутид, лираглутид): одатда клиник аҳамиятга эга тўғридан-тўғри ўзаро таъсир кузатилмайди. Қусиш ва диарея кузатилганда организмнинг сувсизланиши ва буйраклар функциясини назорат қилиш муҳим.\n• Метформин: одатда клиник аҳамиятга эга тўғридан-тўғри ўзаро таъсир кузатилмайди. СБК мавжуд бўлганда метформиннинг организмда тўпланиши ва лактоацидоз хавфини ҳисобга олиш зарур. Натрий бикарбонат лактоацидознинг олдини олмайди ва уни даволаш ўрнини босмайди.\nАсосий хулоса: натрий бикарбонатни ушбу препаратлар билан бирга қўллашда буйраклар функцияси, кислота-ишқор мувозанати ва сув-электролитлар мувозанатига алоҳида эътибор қаратиш лозим. Кетоацидоз ёки лактоацидозга шубҳа туғилганда шошилинч тиббий баҳолаш талаб этилади."]},
{k:"c",ru:["Нефролог: «Пациент 64 года, ХБП 3б (СКФ 38), АГ, бикарбонат сыворотки 19 ммоль/л, отёков нет. Хочу назначить щелочную терапию, но опасаюсь натриевой нагрузки». Что вы ответите?","Подтвердить, что опасение обоснованно: пример 1 г бикарбоната содержит ≈12 ммоль (≈274 мг) натрия, значит 1 г/сутки — примерно 0,274 г натрия, что следует учесть в рационе. Практика: начать с низкой дозы (например, 1000 мг 1 раз в сутки), контролировать АД, вес, отёки, бикарбонат и калий через 2–4 недели, при необходимости корректировать диуретики."],uz:["Нефролог: «Бемор 64 ёшда, СБК 3б (КФТ 38), АГ, қон зардобида бикарбонат 19 ммоль/л, шиш йўқ. Ишқорловчи терапия тайинламоқчиман, лекин натрий юкламасидан хавотирдаман». Сиз нима дейсиз?","Хавотир асосли эканини тасдиқлаш керак: масалан 1 г бикарбонатда ≈12 ммоль (≈274 мг) натрий бор, демак 1 г/сутка — тахминан 0,274 г натрий, буни рационда ҳисобга олиш лозим. Амалиёт: паст дозадан бошлаш (масалан, 1000 мг кунига 1 марта), 2–4 ҳафтадан кейин ҚБ, вазн, шиш, бикарбонат ва калийни назорат қилиш, зарур бўлса диуретикларни тузатиш."]},
{k:"c",ru:["Нефролог: ХБП + хроническая сердечная недостаточность. Ситуация: Пациент 76 лет, ХБП 3б, хроническая сердечная недостаточность, периодически возникают отёки голеней. Бикарбонат — 18 ммоль/л. Вопрос: Какой главный риск необходимо обсудить?","Дополнительная натриевая нагрузка может способствовать задержке жидкости и ухудшению сердечной недостаточности. Необходимо оценить компенсацию сердечной недостаточности и альтернативные подходы. Решение о натрия бикарбонате принимается индивидуально, с контролем массы тела, отёков, АД и лабораторных показателей."],uz:["Нефролог: СБК + сурункали юрак етишмовчилиги. Вазият: 76 ёшли беморда ХБП 3б босқичи ва сурункали юрак етишмовчилиги мавжуд. Вақти-вақти билан болдир соҳасида шишлар пайдо бўлади. Бикарбонат даражаси — 18 ммоль/л. Савол: Қайси асосий хавфни муҳокама қилиш керак?","Қўшимча натрий юкламаси организмда суюқлик тутилиб қолишига ва юрак етишмовчилигининг ёмонлашишига олиб келиши мумкин. Юрак етишмовчилигининг компенсация ҳолатини баҳолаш ва муқобил ёндашувларни кўриб чиқиш зарур. Натрий бикарбонатни қўллаш тўғрисидаги қарор ҳар бир бемор учун индивидуал равишда қабул қилинади. Бунда тана вазни, шишлар, артериал қон босими ва лаборатория кўрсаткичларини назорат қилиш лозим."]},
{k:"c",ru:["ХБП и артериальная гипертензия. Специальность: нефролог. Клиническая ситуация: пациент 68 лет с ХБП и артериальной гипертензией. Бикарбонат — 17 ммоль/л. Врач рассматривает назначение натрия бикарбоната, но опасается увеличения натриевой нагрузки и ухудшения контроля артериального давления. Вопросы: 1. Какие риски необходимо учитывать при назначении Бикарбонорм? 2. Какие показатели следует контролировать до и после начала терапии? 3. Как оценить соотношение ожидаемой пользы и риска у данного пациента?","1. Какие риски необходимо учитывать? Бикарбонорм увеличивает поступление натрия в организм, что может способствовать повышению артериального давления и задержке жидкости.\n2. Что контролировать?\n• Артериальное давление.\n• Натрий и бикарбонат крови.\n• Массу тела и наличие отёков.\n• Функцию почек и калий.\n3. Как оценить соотношение пользы и риска? Если ацидоз подтверждён и требует коррекции, врач оценивает ожидаемую пользу и риск натриевой нагрузки. При неконтролируемой гипертензии, отёках или сердечной недостаточности необходима особая осторожность."],uz:["СБК, ацидоз ва артериал гипертензия. Мутахассислик: нефролог. Клиник вазият: 68 ёшли беморда сурункали буйрак касаллиги (СБК) ва артериал гипертензия мавжуд. Қонда бикарбонат даражаси — 17 ммоль/л. Шифокор натрий бикарбонатни буюришни кўриб чиқмоқда, бироқ натрий юкламасининг ортиши ва артериал қон босимини назорат қилиш қийинлашишидан хавотирда. Саволлар: 1. Бикарбонормни буюришда қандай хавфларни ҳисобга олиш керак? 2. Даволашни бошлашдан олдин ва кейин қайси кўрсаткичларни назорат қилиш лозим? 3. Ушбу беморда кутилаётган фойда ва хавф нисбатини қандай баҳолаш мумкин?","1. Қандай хавфларни ҳисобга олиш керак? Бикарбонорм организмга натрий тушишини оширади. Бу артериал қон босимининг кўтарилишига ва организмда суюқлик тутилиб қолишига сабаб бўлиши мумкин.\n2. Нималарни назорат қилиш керак?\n• Артериал қон босими.\n• Қонда натрий ва бикарбонат даражаси.\n• Тана вазни ва шишларнинг мавжудлиги.\n• Буйраклар функцияси ва қонда калий даражаси.\n3. Фойда ва хавф нисбатини қандай баҳолаш керак? Агар ацидоз тасдиқланган бўлса ва уни даволаш зарур деб топилса, шифокор даволашдан кутилаётган фойдани натрий юкламаси билан боғлиқ хавфлар билан таққослайди. Назорат қилинмаётган артериал гипертензия, шишлар ёки юрак етишмовчилиги мавжуд бўлганда алоҳида эҳтиёткорлик талаб этилади."]}
]}];
